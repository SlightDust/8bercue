name: build-apk

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: ${{ github.workspace }}/android-sdk
      ANDROID_SDK_ROOT: ${{ github.workspace }}/android-sdk
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Install command-line tools directly instead of relying on a third-party setup
      # action, so a transient failure in that action cannot block the build.
      - name: Install Android command-line tools
        run: |
          set -euo pipefail
          mkdir -p "$ANDROID_HOME/cmdline-tools"
          cd "$ANDROID_HOME/cmdline-tools"
          curl -fsSL --retry 5 --retry-delay 5 --retry-all-errors \
            -o tools.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q tools.zip
          mv cmdline-tools latest
          rm tools.zip
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --version

      - name: Install platform 36 and build-tools 35
        run: |
          set -euo pipefail
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$PATH"
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager --install "platforms;android-36" "build-tools;35.0.0"
          ls "$ANDROID_HOME/platforms" "$ANDROID_HOME/build-tools"

      - name: Decode signing keystore
        env:
          KEYSTORE_B64: ${{ secrets.FIVEBER_KEYSTORE_B64 }}
        run: |
          set -euo pipefail
          if [ -z "${KEYSTORE_B64:-}" ]; then
            echo "::error::FIVEBER_KEYSTORE_B64 secret is not set"; exit 1
          fi
          printf '%s' "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
          test -s "$RUNNER_TEMP/release.jks"

      - name: Build release APK
        env:
          FIVEBER_RELEASE_KEYSTORE: ${{ runner.temp }}/release.jks
          FIVEBER_RELEASE_STORE_PASSWORD: ${{ secrets.FIVEBER_STORE_PASSWORD }}
          FIVEBER_RELEASE_KEY_ALIAS: ${{ secrets.FIVEBER_KEY_ALIAS }}
          FIVEBER_RELEASE_KEY_PASSWORD: ${{ secrets.FIVEBER_KEY_PASSWORD }}
        run: |
          chmod +x android-app/gradlew
          android-app/gradlew -p android-app :app:assembleRelease --console=plain --no-daemon --stacktrace

      - name: Show outputs
        run: find android-app/app/build/outputs -name '*.apk' -exec ls -l {} \;

      - name: Verify signed artifact
        run: |
          python3 android-app/tools/verify_artifact.py \
            android-app/app/build/outputs/apk/release/app-release.apk \
            --build-tools "$ANDROID_HOME/build-tools/35.0.0" \
            --allow-unsigned

      - name: Compute digest
        run: |
          cd android-app/app/build/outputs/apk/release
          sha256sum app-release.apk | tee apk-sha256.txt

      - uses: actions/upload-artifact@v4
        with:
          name: 8bercue-release-apk
          path: |
            android-app/app/build/outputs/apk/release/app-release.apk
            android-app/app/build/outputs/apk/release/apk-sha256.txt
          retention-days: 30
